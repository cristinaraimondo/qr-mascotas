<!doctype html><html lang="es"><head><title>Mis mascotas · QR Mascotas</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#fff8f1;color:#343044;margin:0}main{max-width:650px;margin:35px auto;padding:24px}section{background:white;border-radius:24px;padding:26px;box-shadow:0 8px 30px #69568b18;margin:18px 0}h1{color:#7658a8}input,select,textarea{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #d9cee9;border-radius:12px;box-sizing:border-box;font:inherit}button{border:0;background:#7658a8;color:white;border-radius:30px;padding:14px 20px;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}a{color:#7658a8}small{color:#777}#msg{white-space:pre-wrap;color:#6846a0}.hide{display:none}img.pet{max-width:240px;border-radius:18px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://seapkqflohatmjixfftu.supabase.co','sb_publishable_aqhd5fsqMo5y7_gOvv6pig_5QZCuOas');const $=id=>document.getElementById(id);const say=t=>$('msg').textContent=t;const root='https://cristinaraimondo.github.io/qr-mascotas/';async function current(){return (await sb.auth.getUser()).data.user}async function login(){let email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return say('Completá correo y contraseña.');let r=await sb.auth.signInWithPassword({email,password});if(r.error){const m=r.error.message||'';return say(/invalid login credentials/i.test(m)?'El correo o la contraseña no coinciden. Si ya confirmaste el correo, usá «Recuperar contraseña». No vuelvas a crear la cuenta.':/email not confirmed/i.test(m)?'Todavía falta confirmar el correo. Revisá tu bandeja de entrada y Spam.':m)}location.reload()}async function signup(){if(id)localStorage.setItem('qr_mascotas_activacion_pendiente',id);const email=$('email').value.trim(),password=$('pass').value;if(!email||!password)return say('Completá correo y contraseña.');if(password.length<8)return say('La contraseña debe tener al menos 8 caracteres.');const r=await sb.auth.signUp({email,password,emailRedirectTo:root+'mascota.html'+(id?'?id='+encodeURIComponent(id):'')});if(r.error)return say(r.error.message==='email rate limit exceeded'?'El envío de correos está temporalmente limitado. Primero hay que desactivar la confirmación en Supabase.':r.error.message);if(r.data.session){say('¡Cuenta creada! Ya podés activar tu medallita.');return location.reload()}say('La cuenta se creó, pero Supabase todavía exige confirmar el correo. Desactivá «Confirm email» en Supabase para permitir el acceso inmediato.')} async function resetPassword(){const email=$('email').value.trim();if(!email)return say('Escribí primero tu correo electrónico.');const redirect=root+'mascota.html'+(id?'?id='+encodeURIComponent(id):'');const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:redirect});say(r.error?r.error.message:'Si existe una cuenta con ese correo, recibirás un enlace para cambiar la contraseña. Revisá tu bandeja de entrada y Spam.')}async function logout(){await sb.auth.signOut();location.reload()}</script><style>.animal{display:flex;gap:16px;align-items:center;border:1px solid #eee6f7;padding:14px;border-radius:18px;margin:12px 0}.animal img{width:86px;height:86px;object-fit:cover;border-radius:14px}.animal a{display:inline-block;padding:10px 15px;border-radius:25px;background:#7658a8;color:white;text-decoration:none;font-weight:700}.animal h3{margin:0 0 6px}</style></head><body><main><a href="./">← 🐾 QR Mascotas</a><h1>🐶🐱 Mis mascotas</h1><p>Entrá para ver y editar las medallitas que activaste con tu cuenta.</p><section id="auth"><h2>Ingresar a mi cuenta</h2><input id="email" type="email" autocomplete="email" placeholder="Correo electrónico"><input id="pass" type="password" autocomplete="current-password" placeholder="Contraseña"><button onclick="login()">Ingresar</button><p><small>Usá el mismo correo y contraseña con los que activaste tu medallita.</small></p></section><section id="list" class="hide"><h2>Mis medallitas</h2><p id="cuenta" style="color:#6c6380;font-size:14px"></p><div id="cards"></div><button onclick="logout()">Cerrar sesión</button></section><p id="msg" role="status"></p></main><script>
async function load(){const user=await current();$('auth').classList.toggle('hide',!!user);$('list').classList.toggle('hide',!user);if(!user)return;$('cuenta').textContent='Cuenta actual: '+(user.email||'sin correo');const r=await sb.from('medallas').select('id,nombre,especie,foto_url,activada_en').eq('propietario_id',user.id).not('activada_en','is',null).order('activada_en',{ascending:false});if(r.error)return say('No pudimos cargar tus medallitas: '+r.error.message);const cards=$('cards');cards.replaceChildren();if(!r.data.length){cards.textContent='No encontramos medallitas asociadas a este correo. Si ya activaste una, cerrá sesión e ingresá con el correo que usaste al activarla.';return}for(const pet of r.data){const row=document.createElement('div');row.className='animal';if(pet.foto_url){const img=document.createElement('img');img.src=pet.foto_url;img.alt='Foto de '+(pet.nombre||'mascota');row.append(img)}const info=document.createElement('div');const h=document.createElement('h3');h.textContent=(pet.nombre||'Mascota sin nombre')+' 🐾';const p=document.createElement('p');p.textContent=pet.especie||'Medallita activada';const a=document.createElement('a');a.href='./mascota.html?id='+encodeURIComponent(pet.id);a.textContent='Editar ficha';info.append(h,p,a);row.append(info);cards.append(row)}}
load();</script></body></html>
